<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Luma</title>
<style>
:root{--ink:#17162a;--muted:#77758b;--p1:#6b4cff;--p2:#b745ff;--p3:#00cfff;--pink:#ff4fa9;--ok:#14c98b;--warn:#ffad3d;--danger:#ef426f;--line:rgba(88,71,170,.12);--panel:rgba(255,255,255,.88)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,Roboto,Arial,sans-serif;color:var(--ink);background:#f7f6ff}.app{height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:linear-gradient(155deg,#fff 0%,#f8f2ff 42%,#eefcff 100%)}.orb{position:absolute;border-radius:50%;filter:blur(36px);opacity:.28;pointer-events:none;animation:float 8s ease-in-out infinite}.o1{width:210px;height:210px;background:#a358ff;top:-80px;right:-65px}.o2{width:190px;height:190px;background:#00d7ff;left:-85px;top:39%;animation-delay:-2s}.o3{width:175px;height:175px;background:#ff65ae;right:-65px;bottom:85px;animation-delay:-4s}@keyframes float{50%{transform:translate(18px,22px) scale(1.09)}}header{z-index:4;display:flex;align-items:center;gap:9px;padding:12px 13px;padding-top:max(12px,env(safe-area-inset-top));background:rgba(251,250,255,.78);backdrop-filter:blur(22px);border-bottom:1px solid var(--line)}.mark{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:white;font-size:23px;font-weight:900;background:linear-gradient(135deg,var(--p1),var(--p2) 48%,var(--p3));box-shadow:0 10px 26px rgba(103,74,255,.28)}.brand{flex:1;min-width:0}.brand h1{font-size:22px;margin:0;letter-spacing:-.4px}.status{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;font-weight:750;margin-top:2px}.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(20,201,139,.12)}.dot.busy{background:var(--warn);box-shadow:0 0 0 4px rgba(255,173,61,.13)}.iconbtn{border:0;width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.92);box-shadow:0 7px 18px rgba(49,38,105,.08);font-size:18px;color:#45425b}.screenbtn{border:0;height:42px;border-radius:14px;padding:0 12px;background:rgba(255,255,255,.92);box-shadow:0 7px 18px rgba(49,38,105,.08);font-size:12px;font-weight:850;color:#5a5670}.screenbtn.on{color:#fff;background:linear-gradient(135deg,#10b981,#06b6d4);box-shadow:0 8px 20px rgba(16,185,129,.25)}.modebar{z-index:3;display:flex;gap:8px;padding:11px 14px 7px;overflow-x:auto;scrollbar-width:none}.modebar::-webkit-scrollbar{display:none}.mode{border:1px solid var(--line);padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.8);color:#67647a;font-size:13px;font-weight:850;white-space:nowrap}.mode.active{color:#fff;border-color:transparent;background:linear-gradient(120deg,var(--p1),var(--p2));box-shadow:0 8px 20px rgba(111,76,255,.23)}.screenstrip{z-index:3;margin:0 14px 5px;display:none;align-items:center;gap:8px;padding:9px 12px;border-radius:15px;background:rgba(17,201,142,.09);border:1px solid rgba(17,201,142,.16);color:#20715e;font-size:11px;font-weight:800}.screenstrip.show{display:flex}.screenpulse{width:8px;height:8px;border-radius:50%;background:#14c98b;animation:pulse 1.3s infinite}@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(20,201,139,.13)}}#messages{z-index:2;flex:1;overflow-y:auto;padding:6px 15px 24px;scroll-behavior:smooth}.welcome{padding:20px 2px 8px}.hello{font-size:30px;font-weight:900;letter-spacing:-1px;margin:0}.grad{background:linear-gradient(90deg,var(--p1),var(--p2),var(--p3));-webkit-background-clip:text;color:transparent}.sub{font-size:14px;line-height:1.5;color:var(--muted);margin:7px 0 16px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{border:1px solid rgba(91,68,179,.09);text-align:left;border-radius:18px;padding:13px;background:rgba(255,255,255,.82);box-shadow:0 8px 24px rgba(57,43,120,.06);min-height:80px}.card b{display:block;font-size:13px;margin-bottom:5px}.card span{font-size:11px;color:var(--muted);line-height:1.3}.msg{display:flex;margin:12px 0;animation:rise .26s ease}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.msg.user{justify-content:flex-end}.airow{display:flex;align-items:flex-start;gap:8px;width:100%}.mini{flex:0 0 28px;width:28px;height:28px;border-radius:10px;display:grid;place-items:center;color:white;font-size:14px;font-weight:900;background:linear-gradient(135deg,var(--p1),var(--p3));margin-top:4px}.bubble{max-width:87%;padding:13px 15px;border-radius:20px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}.assistant .bubble{background:var(--panel);border:1px solid rgba(88,70,174,.09);box-shadow:0 8px 24px rgba(56,43,117,.07);border-bottom-left-radius:7px}.user .bubble{color:white;background:linear-gradient(135deg,#6f4cff,#974af5 55%,#c044ff);box-shadow:0 9px 24px rgba(111,76,255,.23);border-bottom-right-radius:7px}.typing{display:flex;gap:5px;align-items:center;height:22px}.typing i{width:7px;height:7px;border-radius:50%;background:#8d80cd;animation:hop 1.1s infinite}.typing i:nth-child(2){animation-delay:.13s}.typing i:nth-child(3){animation-delay:.26s}@keyframes hop{0%,60%,100%{transform:none;opacity:.45}30%{transform:translateY(-5px);opacity:1}}.media{max-width:92%;padding:7px;background:#fff;border-radius:21px;border:1px solid var(--line);box-shadow:0 12px 34px rgba(57,43,120,.10)}.media img,.media video{display:block;width:100%;border-radius:16px;background:#ececf2;min-height:210px;object-fit:cover}.media video{min-height:180px}.caption{padding:8px 7px 5px;font-size:12px;color:var(--muted)}.error .bubble{background:#fff4f7;border-color:#ffd1dc;color:#9a3950}.composer-wrap{z-index:4;padding:8px 13px max(12px,env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(249,248,255,.99) 66%,rgba(249,248,255,0))}.composer{display:flex;align-items:flex-end;gap:8px;padding:7px 7px 7px 14px;border-radius:25px;background:rgba(255,255,255,.96);border:1px solid rgba(91,70,179,.12);box-shadow:0 12px 35px rgba(58,44,122,.12)}textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font-size:15px;line-height:22px;max-height:112px;min-height:42px;padding:10px 0}textarea::placeholder{color:#aaa6bb}.send{width:46px;height:46px;flex:0 0 46px;border:0;border-radius:16px;color:white;background:linear-gradient(135deg,var(--p1),var(--p2) 55%,var(--pink));box-shadow:0 8px 20px rgba(111,76,255,.27);font-size:22px}.send:disabled{opacity:.45}.hint{text-align:center;color:#a09bad;font-size:10px;padding-top:5px}.sheet{position:fixed;z-index:20;inset:0;background:rgba(27,22,50,.25);display:none;align-items:flex-end;backdrop-filter:blur(5px)}.sheet.show{display:flex}.panel{width:100%;max-height:80dvh;overflow:auto;background:#fbfaff;border-radius:28px 28px 0 0;padding:15px 18px max(22px,env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(51,36,107,.18)}.handle{width:45px;height:5px;border-radius:5px;background:#ded9ea;margin:0 auto 16px}.panelhead{display:flex;align-items:center;gap:10px}.panelhead h2{font-size:20px;margin:0;flex:1}.newchat{border:0;border-radius:14px;background:linear-gradient(135deg,var(--p1),var(--p2));color:white;padding:10px 13px;font-weight:850}.history-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}.history-item{border:1px solid var(--line);background:#fff;border-radius:17px;padding:13px;text-align:left}.history-item.active{border-color:#9b70ff;box-shadow:0 0 0 3px rgba(111,76,255,.08)}.history-title{font-weight:850;font-size:14px;color:#29283e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history-preview{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="app">
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<header><div class="mark">L</div><div class="brand"><h1>Luma</h1><div class="status"><span class="dot" id="dot"></span><span id="status">AI ready</span></div></div><button class="screenbtn" id="screenBtn" onclick="toggleScreen()">Live screen</button><button class="iconbtn" onclick="openHistory()">☰</button><button class="iconbtn" onclick="newChat(true)">＋</button></header>
<div class="modebar"><button class="mode active" id="mchat" onclick="setMode('chat')">✦ Chat</button><button class="mode" id="mimage" onclick="setMode('image')">▧ Image</button><button class="mode" id="mvideo" onclick="setMode('video')">▶ Video</button></div>
<div class="screenstrip" id="screenStrip"><span class="screenpulse"></span><span id="screenText">Luma is viewing your screen in the background</span></div>
<main id="messages"></main>
<div class="composer-wrap"><div class="composer"><textarea id="input" rows="1" placeholder="Message Luma…"></textarea><button class="send" id="send" onclick="sendMessage()">→</button></div><div class="hint">Enter to send · Shift + Enter for a new line</div></div>
</div>
<div class="sheet" id="historySheet" onclick="if(event.target===this)closeHistory()"><div class="panel"><div class="handle"></div><div class="panelhead"><h2>Chat history</h2><button class="newchat" onclick="newChat(true)">＋ New chat</button></div><div class="history-list" id="historyList"></div></div></div>
<script>
const HORDE='https://aihorde.net/api/v2';
const ANON='0000000000';
const AGENT='Luma:2.6:android';
const POLL_IMAGE='https://image.pollinations.ai/prompt/';
const POLL_VIDEO='https://video.pollinations.ai/generate';
let mode='chat',busy=false,conversations=[],activeId=null,screenOn=false;
const $=id=>document.getElementById(id),messages=$('messages'),input=$('input'),send=$('send');
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function load(){try{conversations=JSON.parse(localStorage.getItem('luma_conversations_v6')||'[]')}catch(e){conversations=[]}}
function save(){localStorage.setItem('luma_conversations_v6',JSON.stringify(conversations))}
function active(){return conversations.find(c=>c.id===activeId)}
function titleFrom(s){let t=s.trim().replace(/\s+/g,' ').split(' ').slice(0,5).join(' ');return t.length>38?t.slice(0,38):t||'New chat'}
function newChat(opened){const c={id:uid(),title:'New chat',created:Date.now(),messages:[]};conversations.unshift(c);activeId=c.id;save();render();if(opened)closeHistory()}
function boot(){load();newChat(false);render();setStatus('AI ready · no sign-in',false);checkHeartbeat();syncScreenStatus();setInterval(syncScreenStatus,2500)}
function setStatus(t,isBusy){$('status').textContent=t;$('dot').classList.toggle('busy',!!isBusy)}
async function checkHeartbeat(){try{const r=await fetch(HORDE+'/status/heartbeat',{headers:{'Client-Agent':AGENT}});if(r.ok&&!busy)setStatus('AI Horde online · no sign-in',false)}catch(e){if(!busy)setStatus('AI network unavailable',true)}}
function setMode(m){mode=m;['chat','image','video'].forEach(x=>$('m'+x).classList.toggle('active',x===m));input.placeholder=m==='chat'?'Message Luma…':m==='image'?'Describe the image you want…':'Describe the video you want…'}
function welcome(){return `<div class="welcome"><h2 class="hello"><span class="grad">Anything is possible</span><br>with Luma</h2><div class="sub">Chat, generate higher-quality Flux images, create AI videos, or let Luma view your screen with your permission.</div><div class="cards"><button class="card" onclick="quick('Explain something interesting about space')"><b>✦ Ask anything</b><span>Questions, ideas, writing and help</span></button><button class="card" onclick="setMode('image');quick('A cinematic futuristic city at sunset, ultra detailed, volumetric light')"><b>▧ Flux image</b><span>Higher-quality image generation</span></button><button class="card" onclick="setMode('video');quick('A futuristic city at night, cinematic camera movement, neon rain')"><b>▶ AI video</b><span>Create a short generated clip</span></button><button class="card" onclick="toggleScreen()"><b>◉ Live screen</b><span>Works while Luma is in background</span></button></div></div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const c=active();if(!c||!c.messages.length){messages.innerHTML=welcome();return}messages.innerHTML='';for(const m of c.messages)addMsg(m,false);messages.scrollTop=messages.scrollHeight}
function addMsg(m,scroll=true){let el=document.createElement('div');if(m.kind==='image'){el.className='msg assistant';el.innerHTML=`<div class="airow"><div class="mini">L</div><div class="media"><img src="${esc(m.src)}"><div class="caption">${esc(m.text||'Generated by Luma')}</div></div></div>`}else if(m.kind==='video'){el.className='msg assistant';el.innerHTML=`<div class="airow"><div class="mini">L</div><div class="media"><video src="${esc(m.src)}" controls playsinline></video><div class="caption">${esc(m.text||'Generated video')}</div></div></div>`}else if(m.role==='user'){el.className='msg user';el.innerHTML=`<div class="bubble">${esc(m.text)}</div>`}else{el.className='msg assistant'+(m.error?' error':'');el.innerHTML=`<div class="airow"><div class="mini">L</div><div class="bubble">${esc(m.text)}</div></div>`}messages.appendChild(el);if(scroll)messages.scrollTop=messages.scrollHeight}
function typing(on,label='Thinking…'){const old=$('typing');if(old)old.remove();if(!on)return;let el=document.createElement('div');el.id='typing';el.className='msg assistant';el.innerHTML=`<div class="airow"><div class="mini">L</div><div class="bubble"><div style="font-size:11px;color:#827da0;margin-bottom:6px">${esc(label)}</div><div class="typing"><i></i><i></i><i></i></div></div></div>`;messages.appendChild(el);messages.scrollTop=messages.scrollHeight}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function jsonFetch(url,options={}){const r=await fetch(url,options);let data;try{data=await r.json()}catch(e){throw new Error('Invalid AI service response')}if(!r.ok)throw new Error(data?.message||data?.error||('HTTP '+r.status));return data}
async function pickModel(type){try{const arr=await jsonFetch(HORDE+'/status/models?type='+encodeURIComponent(type)+'&min_count=1',{headers:{'Client-Agent':AGENT}});if(!Array.isArray(arr)||!arr.length)return null;arr.sort((a,b)=>(b.count||0)-(a.count||0));const prefs=type==='text'?[/qwen/i,/llama/i,/mistral/i,/gemma/i]:[/stable.?diffusion.?xl/i,/sdxl/i,/real/i,/dream/i];for(const p of prefs){const hit=arr.find(x=>p.test(x.name||''));if(hit)return hit.name}return arr[0].name}catch(e){return null}}
function conversationPrompt(userText){const c=active();const msgs=(c?.messages||[]).filter(x=>x.kind!=='image'&&x.kind!=='video').slice(-10);let history=msgs.map(m=>(m.role==='user'?'User':'Luma')+': '+m.text).join('\n');let screen='';try{if(window.LumaNative&&LumaNative.isScreenSharing()){screen=LumaNative.getScreenContext()||''}}catch(e){}return `You are Luma, a helpful, capable mobile AI assistant. Reply naturally and clearly. ${screen?`The user has explicitly enabled Live Screen sharing. A current visual caption of their phone screen is: "${screen}". Use it only when relevant to their request.`:''}\n\n${history}\nUser: ${userText}\nLuma:`}
async function generateChat(prompt){const model=await pickModel('text');const body={prompt:conversationPrompt(prompt),params:{max_length:420,max_context_length:4096,temperature:.72,top_p:.92,rep_pen:1.08},trusted_workers:false,slow_workers:true};if(model)body.models=[model];const submitted=await jsonFetch(HORDE+'/generate/text/async',{method:'POST',headers:{'Content-Type':'application/json','apikey':ANON,'Client-Agent':AGENT},body:JSON.stringify(body)});if(!submitted.id)throw new Error('Text generation was not accepted');for(let i=0;i<80;i++){await sleep(1600);const s=await jsonFetch(HORDE+'/generate/text/status/'+submitted.id,{headers:{'Client-Agent':AGENT}});if(Array.isArray(s.generations)&&s.generations.length){const t=s.generations[0].text;if(t)return t.trim()}if(s.faulted)throw new Error('Text worker failed')}throw new Error('The AI queue took too long. Try again.')}
function pollinationsImageUrl(prompt){const seed=Math.floor(Math.random()*1000000000);return POLL_IMAGE+encodeURIComponent(prompt)+'?width=1024&height=1024&model=flux&enhance=true&safe=true&seed='+seed}
function preloadImage(src){return new Promise((resolve,reject)=>{const i=new Image();let done=false;const timer=setTimeout(()=>{if(!done){done=true;reject(new Error('Image service timed out'))}},60000);i.onload=()=>{if(!done){done=true;clearTimeout(timer);resolve(src)}};i.onerror=()=>{if(!done){done=true;clearTimeout(timer);reject(new Error('Image service failed'))}};i.src=src})}
async function generateHordeImage(prompt){const model=await pickModel('image');const body={prompt,params:{sampler_name:'k_euler_a',cfg_scale:7,steps:28,width:768,height:768,n:1},nsfw:false,censor_nsfw:true,trusted_workers:false,slow_workers:true,r2:true};if(model)body.models=[model];const submitted=await jsonFetch(HORDE+'/generate/async',{method:'POST',headers:{'Content-Type':'application/json','apikey':ANON,'Client-Agent':AGENT},body:JSON.stringify(body)});if(!submitted.id)throw new Error('Image request was not accepted');for(let i=0;i<80;i++){await sleep(1800);const ck=await jsonFetch(HORDE+'/generate/check/'+submitted.id,{headers:{'Client-Agent':AGENT}});if(ck.done){const s=await jsonFetch(HORDE+'/generate/status/'+submitted.id,{headers:{'Client-Agent':AGENT}});if(s.generations?.[0]?.img)return s.generations[0].img;throw new Error('No image returned')}if(ck.faulted)throw new Error('Image worker failed')}throw new Error('Image queue took too long')}
async function generateImage(prompt){const src=pollinationsImageUrl(prompt);try{return await preloadImage(src)}catch(e){return await generateHordeImage(prompt)}}
async function generateVideo(prompt){const seed=Math.floor(Math.random()*1000000000);const r=await fetch(POLL_VIDEO,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,model:'video-gen',duration:6,resolution:'720p',seed})});if(!r.ok)throw new Error('Video service HTTP '+r.status);const ct=(r.headers.get('content-type')||'').toLowerCase();if(ct.includes('application/json')){const j=await r.json();const u=j.url||j.video||j.output||j.result;if(u)return u;throw new Error(j.error||'Video service returned no clip')}const blob=await r.blob();if(blob.size<1000)throw new Error('Video service returned an empty clip');return URL.createObjectURL(blob)}
async function sendMessage(){if(busy)return;const text=input.value.trim();if(!text)return;const c=active();if(c.title==='New chat')c.title=titleFrom(text);const user={role:'user',kind:'text',text};c.messages.push(user);addMsg(user);input.value='';input.style.height='auto';save();busy=true;send.disabled=true;try{if(mode==='chat'){setStatus('Luma is thinking…',true);typing(true,'Thinking with AI Horde…');const out=await generateChat(text);typing(false);const m={role:'assistant',kind:'text',text:out};c.messages.push(m);addMsg(m)}else if(mode==='image'){setStatus('Generating Flux image…',true);typing(true,'Creating a higher-quality image…');const src=await generateImage(text);typing(false);const m={role:'assistant',kind:'image',src,text:'Flux image · anonymous primary + Horde fallback'};c.messages.push(m);addMsg(m)}else{setStatus('Generating AI video…',true);typing(true,'Rendering your AI video…');const src=await generateVideo(text);typing(false);const m={role:'assistant',kind:'video',src,text:'AI-generated video · 6 seconds'};c.messages.push(m);addMsg(m)}save()}catch(e){typing(false);const m={role:'assistant',kind:'text',text:(e&&e.message)||'Generation failed. Please try again.',error:true};c.messages.push(m);addMsg(m);save()}finally{busy=false;send.disabled=false;setStatus(screenOn?'AI ready · Live Screen on':'AI ready · no sign-in',false)}}
function quick(t){input.value=t;sendMessage()}
function openHistory(){renderHistory();$('historySheet').classList.add('show')}
function closeHistory(){$('historySheet').classList.remove('show')}
function renderHistory(){const box=$('historyList');box.innerHTML='';for(const c of conversations){const b=document.createElement('button');b.className='history-item'+(c.id===activeId?' active':'');const p=c.messages?.[c.messages.length-1]?.text||'Empty conversation';b.innerHTML=`<div class="history-title">${esc(c.title)}</div><div class="history-preview">${esc(p)}</div>`;b.onclick=()=>{activeId=c.id;render();closeHistory()};box.appendChild(b)}}
function toggleScreen(){try{if(!window.LumaNative){alert('Live Screen requires the Android app.');return}if(LumaNative.isScreenSharing())LumaNative.stopScreenShare();else LumaNative.startScreenShare()}catch(e){alert('Unable to start Live Screen: '+e.message)}}
window.onNativeScreenShareStatus=function(active,msg){screenOn=!!active;updateScreenUi(msg)}
function syncScreenStatus(){try{screenOn=!!(window.LumaNative&&LumaNative.isScreenSharing())}catch(e){screenOn=false}updateScreenUi()}
function updateScreenUi(msg){$('screenBtn').classList.toggle('on',screenOn);$('screenBtn').textContent=screenOn?'Screen ON':'Live screen';$('screenStrip').classList.toggle('show',screenOn);if(msg&&screenOn)$('screenText').textContent=msg+' · floating STOP button stays visible outside Luma';if(screenOn&&!busy)setStatus('AI ready · Live Screen on',false)}
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,112)+'px'});boot();
</script>
</body>
</html>
