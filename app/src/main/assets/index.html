<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Luma</title>
<style>
:root{--ink:#17162a;--muted:#76758a;--panel:rgba(255,255,255,.84);--line:rgba(87,72,168,.12);--p1:#6f4cff;--p2:#b245ff;--p3:#13c9ff;--p4:#ff5caf;--ok:#18cf91;--shadow:0 18px 45px rgba(85,62,160,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;font-family:Inter,ui-rounded,"SF Pro Display",Roboto,Arial,sans-serif;color:var(--ink);background:#f9f8ff;overflow:hidden}button,textarea{font:inherit}.app{height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:linear-gradient(160deg,#fbfbff 0%,#f7f4ff 44%,#f1fbff 100%)}
.orb{position:absolute;border-radius:50%;filter:blur(30px);opacity:.27;pointer-events:none;animation:float 8s ease-in-out infinite}.o1{width:190px;height:190px;background:#a95cff;top:-75px;right:-55px}.o2{width:160px;height:160px;background:#00d4ff;left:-65px;top:38%;animation-delay:-2s}.o3{width:160px;height:160px;background:#ff77ba;right:-70px;bottom:100px;animation-delay:-4s}@keyframes float{50%{transform:translate(18px,24px) scale(1.08)}}
header{z-index:4;display:flex;align-items:center;gap:10px;padding:13px 14px 12px;padding-top:max(13px,env(safe-area-inset-top));background:rgba(250,249,255,.76);backdrop-filter:blur(22px);border-bottom:1px solid var(--line)}.mark{width:45px;height:45px;border-radius:15px;display:grid;place-items:center;color:#fff;font-size:23px;font-weight:900;background:linear-gradient(135deg,var(--p1),var(--p2) 48%,var(--p3));box-shadow:0 10px 25px rgba(111,76,255,.32);position:relative;overflow:hidden}.mark:after{content:"";position:absolute;width:50px;height:12px;background:rgba(255,255,255,.32);transform:rotate(-35deg);animation:shine 3.2s infinite}@keyframes shine{0%,55%{left:-70px}100%{left:70px}}.brand{flex:1;min-width:0}.brand h1{margin:0;font-size:22px;letter-spacing:-.5px}.status{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;font-weight:750;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot{width:7px;height:7px;flex:0 0 7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(34,217,145,.12);animation:pulse 2s infinite}.dot.off{background:#ffad3b;box-shadow:0 0 0 4px rgba(255,173,59,.14)}@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(34,217,145,0)}}.iconbtn{border:0;width:41px;height:41px;flex:0 0 41px;border-radius:14px;background:rgba(255,255,255,.88);box-shadow:0 7px 20px rgba(49,38,105,.08);font-size:19px;color:#45425b}.iconbtn:active{transform:scale(.94)}
.modebar{z-index:3;display:flex;gap:8px;padding:11px 14px 5px;overflow-x:auto;scrollbar-width:none}.modebar::-webkit-scrollbar{display:none}.mode{border:1px solid var(--line);padding:9px 13px;border-radius:999px;background:rgba(255,255,255,.72);color:#67647a;font-size:13px;font-weight:800;display:flex;gap:7px;align-items:center;white-space:nowrap;transition:.2s}.mode.active{color:white;border-color:transparent;background:linear-gradient(120deg,var(--p1),var(--p2));box-shadow:0 8px 20px rgba(111,76,255,.24);transform:translateY(-1px)}
#messages{z-index:2;flex:1;overflow-y:auto;padding:8px 16px 24px;scroll-behavior:smooth;overscroll-behavior:contain}.welcome{padding:22px 3px 12px;animation:rise .55s ease}.hello{font-size:31px;font-weight:900;letter-spacing:-1.3px;margin:0}.grad{background:linear-gradient(90deg,var(--p1),var(--p2),var(--p3));-webkit-background-clip:text;color:transparent}.sub{font-size:15px;line-height:1.5;color:var(--muted);margin:7px 0 18px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{border:1px solid rgba(91,68,179,.09);text-align:left;border-radius:19px;padding:14px 13px;background:rgba(255,255,255,.74);box-shadow:0 8px 24px rgba(57,43,120,.06);color:var(--ink);min-height:86px;transition:.18s}.card:active{transform:scale(.97)}.card b{display:block;font-size:13px;margin-bottom:5px}.card span{font-size:12px;color:var(--muted);line-height:1.3}.ci{font-size:20px;margin-bottom:7px}.msg{display:flex;margin:12px 0;animation:rise .28s cubic-bezier(.2,.8,.2,1)}@keyframes rise{from{opacity:0;transform:translateY(9px) scale(.985)}to{opacity:1;transform:none}}.msg.user{justify-content:flex-end}.bubble{max-width:87%;padding:13px 15px;border-radius:21px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}.assistant .bubble{background:var(--panel);border:1px solid rgba(88,70,174,.09);box-shadow:0 8px 24px rgba(56,43,117,.07);border-bottom-left-radius:7px}.user .bubble{color:white;background:linear-gradient(135deg,#6f4cff,#974af5 55%,#c044ff);box-shadow:0 9px 24px rgba(111,76,255,.24);border-bottom-right-radius:7px}.airow{display:flex;align-items:flex-start;gap:8px;width:100%}.mini{flex:0 0 auto;width:28px;height:28px;border-radius:10px;display:grid;place-items:center;color:white;font-size:14px;font-weight:900;background:linear-gradient(135deg,var(--p1),var(--p3));box-shadow:0 5px 13px rgba(111,76,255,.22);margin-top:4px}.typing{display:flex;gap:5px;align-items:center;height:22px;padding:0 4px}.typing i{width:7px;height:7px;border-radius:50%;background:#8d80cd;animation:hop 1.1s infinite}.typing i:nth-child(2){animation-delay:.13s}.typing i:nth-child(3){animation-delay:.26s}@keyframes hop{0%,60%,100%{transform:none;opacity:.45}30%{transform:translateY(-5px);opacity:1}}.media-card{max-width:92%;padding:7px;background:white;border-radius:22px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}.media-card img,.media-card video{display:block;width:100%;border-radius:17px;min-height:220px;object-fit:cover;background:linear-gradient(110deg,#eeeaff 25%,#faf9ff 40%,#eeeaff 55%);background-size:300% 100%;animation:loading 1.3s linear infinite}@keyframes loading{to{background-position:-300% 0}}.caption{font-size:12px;color:var(--muted);padding:8px 7px 5px}.error .bubble{border-color:rgba(255,87,123,.2);background:#fff5f7;color:#9a3950}
.composer-wrap{z-index:5;padding:8px 13px max(12px,env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(249,248,255,.98) 65%,rgba(249,248,255,0))}.composer{display:flex;align-items:flex-end;gap:8px;padding:7px 7px 7px 14px;border-radius:25px;background:rgba(255,255,255,.94);border:1px solid rgba(91,70,179,.12);box-shadow:0 12px 35px rgba(58,44,122,.12);backdrop-filter:blur(18px)}textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font-size:15px;line-height:22px;max-height:112px;min-height:42px;padding:10px 0}textarea::placeholder{color:#aaa6bb}.send{width:45px;height:45px;flex:0 0 45px;border:0;border-radius:16px;color:white;background:linear-gradient(135deg,var(--p1),var(--p2) 55%,var(--p4));box-shadow:0 8px 20px rgba(111,76,255,.27);display:grid;place-items:center;transition:.18s}.send:active{transform:scale(.91)}.send:disabled{opacity:.42;box-shadow:none}.hint{text-align:center;color:#a09bad;font-size:10px;padding-top:5px}
.sheet{position:fixed;z-index:20;inset:0;background:rgba(27,22,50,.24);display:none;align-items:flex-end;backdrop-filter:blur(5px)}.sheet.show{display:flex}.panel{width:100%;max-height:78dvh;overflow:auto;background:#fbfaff;border-radius:28px 28px 0 0;padding:15px 18px max(22px,env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(51,36,107,.18);animation:up .25s ease}@keyframes up{from{transform:translateY(100%)}to{transform:none}}.handle{width:45px;height:5px;border-radius:5px;background:#ded9ea;margin:0 auto 16px}.panelhead{display:flex;align-items:center;gap:10px}.panelhead h2{font-size:20px;margin:0;flex:1}.newchat{border:0;border-radius:14px;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;padding:10px 13px;font-weight:800}.setting{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;border-bottom:1px solid var(--line)}.setting b{font-size:14px}.setting small{display:block;color:var(--muted);margin-top:3px}.danger{border:0;border-radius:15px;background:#fff0f4;color:#c44060;padding:10px 13px;font-weight:800}.switch{width:48px;height:28px;border:0;border-radius:20px;background:#d9d5e6;padding:3px;transition:.2s}.switch:after{content:"";display:block;width:22px;height:22px;border-radius:50%;background:white;box-shadow:0 2px 8px rgba(0,0,0,.12);transition:.2s}.switch.on{background:linear-gradient(90deg,var(--p1),var(--p3))}.switch.on:after{transform:translateX(20px)}.history-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}.history-item{border:1px solid var(--line);background:#fff;border-radius:17px;padding:13px;text-align:left}.history-item.active{border-color:#9b70ff;box-shadow:0 0 0 3px rgba(111,76,255,.08)}.history-title{font-weight:850;font-size:14px;color:#29283e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history-preview{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty-history{text-align:center;color:var(--muted);padding:25px 0}
.splash{position:fixed;z-index:50;inset:0;display:grid;place-items:center;background:linear-gradient(145deg,#6f4cff,#a840ff 50%,#11c9ff);animation:gone .5s .75s forwards}.splash .smark{width:92px;height:92px;border-radius:29px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);display:grid;place-items:center;color:#fff;font-size:48px;font-weight:900;box-shadow:0 25px 60px rgba(47,20,121,.25);animation:pop .7s cubic-bezier(.2,.9,.25,1)}@keyframes pop{from{transform:scale(.55) rotate(-8deg);opacity:0}}@keyframes gone{to{opacity:0;visibility:hidden}}body.reduced *{animation:none!important;transition:none!important}
</style>
</head>
<body>
<div class="splash"><div class="smark">L</div></div>
<div class="app"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<header><div class="mark">L</div><div class="brand"><h1>Luma</h1><div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Connecting Gemini…</span></div></div><button class="iconbtn" onclick="openHistory()" aria-label="History">☰</button><button class="iconbtn" onclick="newChat(true)" aria-label="New chat">＋</button><button class="iconbtn" onclick="openSettings()" aria-label="Settings">⚙</button></header>
<div class="modebar"><button class="mode active" id="chatMode" onclick="setMode('chat')">✦ Chat</button><button class="mode" id="imageMode" onclick="setMode('image')">▧ Image</button><button class="mode" id="videoMode" onclick="setMode('video')">▶ Video</button></div>
<main id="messages"></main>
<div class="composer-wrap"><div class="composer"><textarea id="input" rows="1" placeholder="Message Luma…"></textarea><button class="send" id="send" onclick="sendMessage()" aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 12h14M13 6l6 6-6 6" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div><div class="hint">Enter to send · Shift + Enter for a new line</div></div>
</div>
<div class="sheet" id="historySheet" onclick="if(event.target===this)closeHistory()"><div class="panel"><div class="handle"></div><div class="panelhead"><h2>Chat history</h2><button class="newchat" onclick="newChat(true)">＋ New chat</button></div><div class="history-list" id="historyList"></div></div></div>
<div class="sheet" id="settingsSheet" onclick="if(event.target===this)closeSettings()"><div class="panel"><div class="handle"></div><div class="panelhead"><h2>Luma settings</h2></div><div class="setting"><div><b>Motion & animations</b><small>Gradient movement and message animation</small></div><button id="motion" class="switch on" onclick="toggleMotion()"></button></div><div class="setting"><div><b>Gemini AI</b><small>Chat, image and video are routed securely</small></div><span id="geminiSetting">Checking…</span></div><div class="setting"><div><b>Delete current chat</b><small>Removes only this conversation</small></div><button class="danger" onclick="deleteCurrentChat()">Delete</button></div></div></div>
<script>
let mode='chat',busy=false,conversations=[],activeId=null,pending={};
const messages=document.getElementById('messages'),input=document.getElementById('input'),sendBtn=document.getElementById('send');
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function loadAll(){try{conversations=JSON.parse(localStorage.getItem('lumaConversations')||'[]');if(!Array.isArray(conversations))conversations=[]}catch(e){conversations=[]}}
function saveAll(){localStorage.setItem('lumaConversations',JSON.stringify(conversations.slice(0,60)))}
function current(){return conversations.find(c=>c.id===activeId)||null}
function newChat(showToast=false){const c={id:id(),title:'New chat',createdAt:Date.now(),messages:[]};conversations.unshift(c);activeId=c.id;saveAll();closeHistory();render();if(showToast)flashStatus('New chat started')}
function openConversation(cid){activeId=cid;saveAll();closeHistory();render()}
function deleteCurrentChat(){const i=conversations.findIndex(c=>c.id===activeId);if(i>=0)conversations.splice(i,1);saveAll();closeSettings();newChat(false)}
function welcome(){messages.innerHTML=`<section class="welcome"><h2 class="hello">What can <span class="grad">Luma</span> do for you?</h2><p class="sub">A fresh chat starts every time you open Luma. Older chats stay in History.</p><div class="cards"><button class="card" onclick="quick('Explain something difficult in a simple way')"><div class="ci">🧠</div><b>Explain anything</b><span>Learn a topic simply</span></button><button class="card" onclick="quick('Help me brainstorm a creative new idea')"><div class="ci">✨</div><b>Brainstorm</b><span>Turn an idea into a plan</span></button><button class="card" onclick="setMode('image');quick('A cinematic futuristic city at sunset')"><div class="ci">🎨</div><b>Create image</b><span>Generate with Gemini</span></button><button class="card" onclick="setMode('video');quick('A cinematic drone shot over a neon city at night')"><div class="ci">🎬</div><b>Create video</b><span>Generate a short AI video</span></button></div></section>`}
function render(){messages.innerHTML='';const c=current();if(!c||!c.messages.length){welcome();return}c.messages.forEach(renderOne);scrollBottom()}
function renderOne(m){const el=document.createElement('div');if(m.type==='image'){el.className='msg assistant';el.innerHTML=`<div class="airow"><div class="mini">L</div><div class="media-card"><img src="${esc(m.url)}" alt="AI generated image"><div class="caption">${esc(m.text||'Generated image')}</div></div></div>`}else if(m.type==='video'){el.className='msg assistant';el.innerHTML=`<div class="airow"><div class="mini">L</div><div class="media-card"><video src="${esc(m.url)}" controls playsinline preload="metadata"></video><div class="caption">${esc(m.text||'Generated video')}</div></div></div>`}else{el.className='msg '+(m.role==='user'?'user':'assistant')+(m.error?' error':'');el.innerHTML=m.role==='assistant'?`<div class="airow"><div class="mini">L</div><div class="bubble">${esc(m.text)}</div></div>`:`<div class="bubble">${esc(m.text)}</div>`}messages.appendChild(el)}
function add(m){const c=current();if(!c)return;c.messages.push(m);saveAll();if(c.messages.length===1)messages.innerHTML='';renderOne(m);scrollBottom()}
function scrollBottom(){requestAnimationFrame(()=>messages.scrollTop=messages.scrollHeight)}
function setMode(m){mode=m;['chat','image','video'].forEach(x=>document.getElementById(x+'Mode').classList.toggle('active',m===x));input.placeholder=m==='image'?'Describe the image you want…':m==='video'?'Describe the video you want…':'Message Luma…';input.focus()}
function quick(t){input.value=t;resize();input.focus()}
function contents(){const c=current();return (c?.messages||[]).filter(m=>m.type==='text'&&!m.error&&(m.role==='user'||m.role==='assistant')).slice(-20).map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.text}]}))}
function maybeTitle(firstText){const c=current();if(!c||c.title!=='New chat')return;c.title=firstText.split(/\s+/).slice(0,4).join(' ').slice(0,32)||'New chat';saveAll();if(window.LumaAndroid?.title)LumaAndroid.title(c.id,firstText)}
function sendMessage(){const q=input.value.trim();if(!q||busy)return;input.value='';resize();add({type:'text',role:'user',text:q});maybeTitle(q);busy=true;sendBtn.disabled=true;showTyping();const req=id();pending[req]={mode,conversationId:activeId,prompt:q};try{if(!window.LumaAndroid){throw new Error('bridge')}if(mode==='chat')LumaAndroid.chat(req,JSON.stringify(contents()));else if(mode==='image')LumaAndroid.image(req,q);else LumaAndroid.video(req,q)}catch(e){nativeFail(req,'Could not start the Gemini request.') }}
function showTyping(){const e=document.createElement('div');e.id='typing';e.className='msg assistant';e.innerHTML='<div class="airow"><div class="mini">L</div><div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div></div>';messages.appendChild(e);scrollBottom()}
function stopTyping(){document.getElementById('typing')?.remove();busy=false;sendBtn.disabled=false}
function ensureTarget(req){const p=pending[req];if(!p)return null;const c=conversations.find(x=>x.id===p.conversationId);delete pending[req];return c}
function pushTo(c,m){if(!c)return;c.messages.push(m);saveAll();if(c.id===activeId)render()}
window.LumaNativeCallback={
status(ok){document.getElementById('statusDot').classList.toggle('off',!ok);document.getElementById('statusText').textContent=ok?'Gemini connected':'Gemini setup required';document.getElementById('geminiSetting').textContent=ok?'Connected':'Setup required'},
chat(req,text,error){stopTyping();const c=ensureTarget(req);pushTo(c,{type:'text',role:'assistant',text,error:!!error})},
image(req,url,caption,error){stopTyping();const c=ensureTarget(req);if(error)pushTo(c,{type:'text',role:'assistant',text:caption||'Image generation failed.',error:true});else pushTo(c,{type:'image',role:'assistant',text:caption||'Generated image',url})},
video(req,url,message,error){stopTyping();const c=ensureTarget(req);if(error)pushTo(c,{type:'text',role:'assistant',text:message||'Video generation failed.',error:true});else pushTo(c,{type:'video',role:'assistant',text:'Generated video',url})},
title(cid,title){const c=conversations.find(x=>x.id===cid);if(c&&title){c.title=String(title).replace(/[\n\r\"]/g,' ').trim().slice(0,40)||c.title;saveAll();renderHistoryList()}}
};
function nativeFail(req,t){stopTyping();const c=ensureTarget(req);pushTo(c,{type:'text',role:'assistant',text:t,error:true})}
input.addEventListener('input',resize);function resize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,112)+'px'}
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}})
function openHistory(){renderHistoryList();document.getElementById('historySheet').classList.add('show')}function closeHistory(){document.getElementById('historySheet').classList.remove('show')}
function renderHistoryList(){const box=document.getElementById('historyList');if(!box)return;box.innerHTML='';const useful=conversations.filter(c=>c.messages.length);if(!useful.length){box.innerHTML='<div class="empty-history">No previous chats yet.</div>';return}useful.forEach(c=>{const b=document.createElement('button');b.className='history-item'+(c.id===activeId?' active':'');const first=c.messages.find(m=>m.role==='user');b.innerHTML=`<div class="history-title">${esc(c.title||'New chat')}</div><div class="history-preview">${esc(first?.text||'Conversation')}</div>`;b.onclick=()=>openConversation(c.id);box.appendChild(b)})}
function openSettings(){document.getElementById('settingsSheet').classList.add('show')}function closeSettings(){document.getElementById('settingsSheet').classList.remove('show')}
let reduced=localStorage.getItem('lumaReduced')==='1';function applyMotion(){document.body.classList.toggle('reduced',reduced);document.getElementById('motion').classList.toggle('on',!reduced)}function toggleMotion(){reduced=!reduced;localStorage.setItem('lumaReduced',reduced?'1':'0');applyMotion()}
let oldStatus='';function flashStatus(t){const el=document.getElementById('statusText');oldStatus=el.textContent;el.textContent=t;setTimeout(()=>el.textContent=oldStatus,1200)}
loadAll();conversations=conversations.filter(c=>c&&Array.isArray(c.messages)&&c.messages.length);newChat(false);applyMotion();render();setTimeout(()=>{try{LumaAndroid.status()}catch(e){window.LumaNativeCallback.status(false)}},500);
</script>
</body>
</html>
