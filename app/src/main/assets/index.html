<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Luma</title>
<style>
:root{--ink:#17162a;--muted:#76758a;--panel:rgba(255,255,255,.82);--line:rgba(87,72,168,.11);--p1:#6f4cff;--p2:#b245ff;--p3:#13c9ff;--p4:#ff5caf;--shadow:0 18px 45px rgba(85,62,160,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;font-family:Inter,ui-rounded,"SF Pro Display",Roboto,Arial,sans-serif;color:var(--ink);background:#f9f8ff;overflow:hidden}button,textarea{font:inherit}.app{height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:linear-gradient(160deg,#fbfbff 0%,#f7f4ff 45%,#f2fbff 100%)}
.orb{position:absolute;border-radius:50%;filter:blur(28px);opacity:.26;pointer-events:none;animation:float 8s ease-in-out infinite}.o1{width:180px;height:180px;background:#a95cff;top:-70px;right:-50px}.o2{width:150px;height:150px;background:#00d4ff;left:-60px;top:36%;animation-delay:-2s}.o3{width:150px;height:150px;background:#ff77ba;right:-70px;bottom:110px;animation-delay:-4s}@keyframes float{50%{transform:translate(18px,24px) scale(1.08)}}
header{z-index:4;display:flex;align-items:center;gap:12px;padding:13px 18px 12px;padding-top:max(13px,env(safe-area-inset-top));background:rgba(250,249,255,.72);backdrop-filter:blur(22px);border-bottom:1px solid var(--line)}.mark{width:45px;height:45px;border-radius:15px;display:grid;place-items:center;color:white;font-size:23px;font-weight:900;background:linear-gradient(135deg,var(--p1),var(--p2) 48%,var(--p3));box-shadow:0 10px 25px rgba(111,76,255,.32);position:relative;overflow:hidden}.mark:after{content:"";position:absolute;width:50px;height:12px;background:rgba(255,255,255,.32);transform:rotate(-35deg);animation:shine 3.2s infinite}@keyframes shine{0%,55%{left:-70px}100%{left:70px}}.brand{flex:1}.brand h1{margin:0;font-size:22px;letter-spacing:-.5px}.status{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:700;margin-top:2px}.dot{width:7px;height:7px;border-radius:50%;background:#22d991;box-shadow:0 0 0 4px rgba(34,217,145,.12);animation:pulse 2s infinite}@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(34,217,145,0)}}.iconbtn{border:0;width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.85);box-shadow:0 7px 20px rgba(49,38,105,.08);font-size:21px;color:#45425b}
.modebar{z-index:3;display:flex;gap:8px;padding:11px 16px 5px}.mode{border:1px solid var(--line);padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.7);color:#67647a;font-size:13px;font-weight:800;display:flex;gap:7px;align-items:center;transition:.2s}.mode.active{color:white;border-color:transparent;background:linear-gradient(120deg,var(--p1),var(--p2));box-shadow:0 8px 20px rgba(111,76,255,.24);transform:translateY(-1px)}
#messages{z-index:2;flex:1;overflow-y:auto;padding:8px 16px 24px;scroll-behavior:smooth;overscroll-behavior:contain}.welcome{padding:24px 3px 12px;animation:rise .55s ease}.hello{font-size:32px;font-weight:900;letter-spacing:-1.3px;margin:0}.grad{background:linear-gradient(90deg,var(--p1),var(--p2),var(--p3));-webkit-background-clip:text;color:transparent}.sub{font-size:15px;line-height:1.5;color:var(--muted);margin:7px 0 18px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{border:1px solid rgba(91,68,179,.09);text-align:left;border-radius:19px;padding:15px 13px;background:rgba(255,255,255,.72);box-shadow:0 8px 24px rgba(57,43,120,.06);color:var(--ink);min-height:86px;transition:.18s}.card:active{transform:scale(.97)}.card b{display:block;font-size:13px;margin-bottom:5px}.card span{font-size:12px;color:var(--muted);line-height:1.3}.ci{font-size:20px;margin-bottom:7px}.msg{display:flex;margin:12px 0;animation:rise .28s cubic-bezier(.2,.8,.2,1)}@keyframes rise{from{opacity:0;transform:translateY(9px) scale(.985)}to{opacity:1;transform:none}}.msg.user{justify-content:flex-end}.bubble{max-width:87%;padding:13px 15px;border-radius:21px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}.assistant .bubble{background:var(--panel);border:1px solid rgba(88,70,174,.09);box-shadow:0 8px 24px rgba(56,43,117,.07);border-bottom-left-radius:7px}.user .bubble{color:white;background:linear-gradient(135deg,#6f4cff,#974af5 55%,#c044ff);box-shadow:0 9px 24px rgba(111,76,255,.24);border-bottom-right-radius:7px}.airow{display:flex;align-items:flex-start;gap:8px}.mini{flex:0 0 auto;width:28px;height:28px;border-radius:10px;display:grid;place-items:center;color:white;font-size:14px;font-weight:900;background:linear-gradient(135deg,var(--p1),var(--p3));box-shadow:0 5px 13px rgba(111,76,255,.22);margin-top:4px}.typing{display:flex;gap:5px;align-items:center;height:22px;padding:0 4px}.typing i{width:7px;height:7px;border-radius:50%;background:#8d80cd;animation:hop 1.1s infinite}.typing i:nth-child(2){animation-delay:.13s}.typing i:nth-child(3){animation-delay:.26s}@keyframes hop{0%,60%,100%{transform:none;opacity:.45}30%{transform:translateY(-5px);opacity:1}}.image-card{max-width:92%;padding:7px;background:white;border-radius:22px;box-shadow:var(--shadow);border:1px solid var(--line)}.image-card img{display:block;width:100%;border-radius:17px;min-height:220px;object-fit:cover;background:linear-gradient(110deg,#eeeaff 25%,#faf9ff 40%,#eeeaff 55%);background-size:300% 100%;animation:loading 1.3s linear infinite}@keyframes loading{to{background-position:-300% 0}}.caption{font-size:12px;color:var(--muted);padding:8px 7px 5px}.error .bubble{border-color:rgba(255,87,123,.2);background:#fff5f7;color:#9a3950}
.composer-wrap{z-index:5;padding:8px 13px max(12px,env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(249,248,255,.98) 65%,rgba(249,248,255,0));}.composer{display:flex;align-items:flex-end;gap:8px;padding:7px 7px 7px 14px;border-radius:25px;background:rgba(255,255,255,.92);border:1px solid rgba(91,70,179,.12);box-shadow:0 12px 35px rgba(58,44,122,.12);backdrop-filter:blur(18px)}textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font-size:15px;line-height:22px;max-height:112px;min-height:42px;padding:10px 0}textarea::placeholder{color:#aaa6bb}.send{width:45px;height:45px;flex:0 0 45px;border:0;border-radius:16px;color:white;background:linear-gradient(135deg,var(--p1),var(--p2) 55%,var(--p4));box-shadow:0 8px 20px rgba(111,76,255,.27);display:grid;place-items:center;transition:.18s}.send:active{transform:scale(.91)}.send:disabled{opacity:.42;box-shadow:none}.hint{text-align:center;color:#a09bad;font-size:10px;padding-top:5px}.sheet{position:fixed;z-index:20;inset:0;background:rgba(27,22,50,.24);display:none;align-items:flex-end;backdrop-filter:blur(4px)}.sheet.show{display:flex}.panel{width:100%;background:#fbfaff;border-radius:28px 28px 0 0;padding:15px 18px max(22px,env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(51,36,107,.18);animation:up .25s ease}@keyframes up{from{transform:translateY(100%)}to{transform:none}}.handle{width:45px;height:5px;border-radius:5px;background:#ded9ea;margin:0 auto 16px}.panel h2{font-size:20px;margin:0 0 14px}.setting{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;border-bottom:1px solid var(--line)}.setting b{font-size:14px}.setting small{display:block;color:var(--muted);margin-top:3px}.danger{border:0;border-radius:15px;background:#fff0f4;color:#c44060;padding:10px 13px;font-weight:800}.switch{width:48px;height:28px;border:0;border-radius:20px;background:#d9d5e6;padding:3px;transition:.2s}.switch:after{content:"";display:block;width:22px;height:22px;border-radius:50%;background:white;box-shadow:0 2px 8px rgba(0,0,0,.12);transition:.2s}.switch.on{background:linear-gradient(90deg,var(--p1),var(--p3))}.switch.on:after{transform:translateX(20px)}
.splash{position:fixed;z-index:50;inset:0;display:grid;place-items:center;background:linear-gradient(145deg,#6f4cff,#a840ff 50%,#11c9ff);animation:gone .5s .75s forwards}.splash .smark{width:92px;height:92px;border-radius:29px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);display:grid;place-items:center;color:#fff;font-size:48px;font-weight:900;box-shadow:0 25px 60px rgba(47,20,121,.25);animation:pop .7s cubic-bezier(.2,.9,.25,1)}@keyframes pop{from{transform:scale(.55) rotate(-8deg);opacity:0}}@keyframes gone{to{opacity:0;visibility:hidden}}body.reduced *{animation:none!important;transition:none!important}
</style>
</head>
<body>
<div class="splash"><div class="smark">L</div></div>
<div class="app"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<header><div class="mark">L</div><div class="brand"><h1>Luma</h1><div class="status"><span class="dot"></span><span>Free AI connected</span></div></div><button class="iconbtn" onclick="openSettings()" aria-label="Settings">⚙</button></header>
<div class="modebar"><button class="mode active" id="chatMode" onclick="setMode('chat')">✦ Chat</button><button class="mode" id="imageMode" onclick="setMode('image')">▧ Create image</button></div>
<main id="messages"></main>
<div class="composer-wrap"><div class="composer"><textarea id="input" rows="1" placeholder="Message Luma…"></textarea><button class="send" id="send" onclick="sendMessage()" aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 12h14M13 6l6 6-6 6" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div><div class="hint">Enter to send · Shift + Enter for a new line</div></div>
</div>
<div class="sheet" id="sheet" onclick="if(event.target===this)closeSettings()"><div class="panel"><div class="handle"></div><h2>Luma settings</h2><div class="setting"><div><b>Motion & animations</b><small>Gradient movement and message animation</small></div><button id="motion" class="switch on" onclick="toggleMotion()"></button></div><div class="setting"><div><b>Conversation memory</b><small>Saved locally on this phone</small></div><span>On</span></div><div class="setting"><div><b>Clear conversation</b><small>Remove saved chat and images</small></div><button class="danger" onclick="clearChat()">Clear</button></div></div></div>
<script>
let mode='chat', busy=false;
let history=[];
try{history=JSON.parse(localStorage.getItem('lumaHistory')||'[]')}catch(e){history=[]}
const messages=document.getElementById('messages'),input=document.getElementById('input'),sendBtn=document.getElementById('send');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){localStorage.setItem('lumaHistory',JSON.stringify(history.slice(-80)))}
function welcome(){messages.innerHTML=`<section class="welcome"><h2 class="hello">What can <span class="grad">Luma</span> do for you?</h2><p class="sub">Chat with AI or switch to image mode. Your conversation stays on this device.</p><div class="cards"><button class="card" onclick="quick('Explain something difficult in a simple way')"><div class="ci">🧠</div><b>Explain anything</b><span>Learn a topic simply</span></button><button class="card" onclick="quick('Help me brainstorm a creative new idea')"><div class="ci">✨</div><b>Brainstorm</b><span>Turn an idea into a plan</span></button><button class="card" onclick="quick('Write something creative for me')"><div class="ci">✍️</div><b>Write</b><span>Stories, text and ideas</span></button><button class="card" onclick="setMode('image');quick('A cinematic futuristic city at sunset')"><div class="ci">🎨</div><b>Create an image</b><span>Generate visual concepts</span></button></div></section>`}
function render(){messages.innerHTML='';if(!history.length){welcome();return}history.forEach(m=>renderOne(m));scrollBottom()}
function renderOne(m){const el=document.createElement('div');if(m.type==='image'){el.className='msg assistant';el.innerHTML=`<div class="airow"><div class="mini">L</div><div class="image-card"><img src="${esc(m.url)}" alt="AI generated image"><div class="caption">${esc(m.text)}</div></div></div>`}else{el.className='msg '+(m.role==='user'?'user':'assistant')+(m.error?' error':'');el.innerHTML=m.role==='assistant'?`<div class="airow"><div class="mini">L</div><div class="bubble">${esc(m.text)}</div></div>`:`<div class="bubble">${esc(m.text)}</div>`}messages.appendChild(el)}
function add(m){history.push(m);save();if(history.length===1)messages.innerHTML='';renderOne(m);scrollBottom()}
function scrollBottom(){requestAnimationFrame(()=>messages.scrollTop=messages.scrollHeight)}
function setMode(m){mode=m;document.getElementById('chatMode').classList.toggle('active',m==='chat');document.getElementById('imageMode').classList.toggle('active',m==='image');input.placeholder=m==='image'?'Describe the image you want…':'Message Luma…';input.focus()}
function quick(t){input.value=t;resize();input.focus()}
function contextFor(q){const recent=history.filter(x=>x.type!=='image').slice(-8).map(x=>(x.role==='user'?'User: ':'Luma: ')+x.text).join('\n');return `You are Luma, a helpful, friendly and capable AI assistant inside the Luma mobile app. Be clear and useful. Never claim to be another assistant. Conversation:\n${recent}\nUser: ${q}\nLuma:`}
function sendMessage(){const q=input.value.trim();if(!q||busy)return;input.value='';resize();add({role:'user',text:q});if(mode==='image'){createImage(q);return}busy=true;sendBtn.disabled=true;showTyping();try{if(window.LumaAndroid&&LumaAndroid.ask)LumaAndroid.ask(contextFor(q));else nativeFail('AI bridge is not available in this build.')}catch(e){nativeFail('Could not start the AI request.')}}
function showTyping(){const e=document.createElement('div');e.id='typing';e.className='msg assistant';e.innerHTML='<div class="airow"><div class="mini">L</div><div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div></div>';messages.appendChild(e);scrollBottom()}
function stopTyping(){document.getElementById('typing')?.remove();busy=false;sendBtn.disabled=false}
window.LumaNativeCallback=function(text,error){stopTyping();add({role:'assistant',text:text,error:!!error})}
function nativeFail(t){stopTyping();add({role:'assistant',text:t,error:true})}
function createImage(q){const url='https://image.pollinations.ai/prompt/'+encodeURIComponent(q)+'?width=1024&height=1024&nologo=true&private=true&seed='+Math.floor(Math.random()*999999);add({type:'image',role:'assistant',text:q,url:url})}
input.addEventListener('input',resize);function resize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,112)+'px'}
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}})
function openSettings(){document.getElementById('sheet').classList.add('show')}function closeSettings(){document.getElementById('sheet').classList.remove('show')}
let reduced=localStorage.getItem('lumaReduced')==='1';function applyMotion(){document.body.classList.toggle('reduced',reduced);document.getElementById('motion').classList.toggle('on',!reduced)}function toggleMotion(){reduced=!reduced;localStorage.setItem('lumaReduced',reduced?'1':'0');applyMotion()}
function clearChat(){history=[];save();closeSettings();welcome()}
applyMotion();render();
</script>
</body>
</html>
