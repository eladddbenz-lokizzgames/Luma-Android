<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Luma</title>
<script src="https://js.puter.com/v2/"></script>
<style>
:root{--ink:#17162a;--muted:#77758b;--p1:#704dff;--p2:#b246ff;--p3:#17cfff;--pink:#ff58b0;--ok:#17cf92;--panel:rgba(255,255,255,.86);--line:rgba(87,72,168,.12)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,Roboto,Arial,sans-serif;color:var(--ink);background:#f8f7ff}.app{height:100dvh;display:flex;flex-direction:column;position:relative;background:linear-gradient(160deg,#fbfbff,#f7f4ff 45%,#effcff);overflow:hidden}.orb{position:absolute;border-radius:50%;filter:blur(32px);opacity:.27;pointer-events:none;animation:float 8s ease-in-out infinite}.o1{width:190px;height:190px;background:#a95cff;top:-70px;right:-55px}.o2{width:170px;height:170px;background:#00d4ff;left:-75px;top:38%;animation-delay:-2s}.o3{width:170px;height:170px;background:#ff77ba;right:-70px;bottom:95px;animation-delay:-4s}@keyframes float{50%{transform:translate(18px,24px) scale(1.08)}}header{z-index:3;display:flex;align-items:center;gap:10px;padding:13px 14px 12px;padding-top:max(13px,env(safe-area-inset-top));background:rgba(250,249,255,.76);backdrop-filter:blur(22px);border-bottom:1px solid var(--line)}.mark{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:#fff;font-size:24px;font-weight:900;background:linear-gradient(135deg,var(--p1),var(--p2) 48%,var(--p3));box-shadow:0 10px 25px rgba(111,76,255,.30)}.brand{flex:1;min-width:0}.brand h1{font-size:22px;margin:0;letter-spacing:-.4px}.status{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;font-weight:750;margin-top:2px}.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(34,217,145,.12)}.dot.off{background:#ffab3d;box-shadow:0 0 0 4px rgba(255,171,61,.14)}.iconbtn{border:0;width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.9);box-shadow:0 7px 20px rgba(49,38,105,.08);font-size:19px;color:#45425b}.modebar{z-index:2;display:flex;gap:8px;padding:11px 14px 6px;overflow-x:auto}.mode{border:1px solid var(--line);padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.74);color:#67647a;font-size:13px;font-weight:800;white-space:nowrap}.mode.active{color:#fff;border-color:transparent;background:linear-gradient(120deg,var(--p1),var(--p2));box-shadow:0 8px 20px rgba(111,76,255,.23)}#messages{z-index:2;flex:1;overflow-y:auto;padding:8px 15px 24px;scroll-behavior:smooth}.welcome{padding:24px 2px 8px}.hello{font-size:30px;font-weight:900;letter-spacing:-1px;margin:0}.grad{background:linear-gradient(90deg,var(--p1),var(--p2),var(--p3));-webkit-background-clip:text;color:transparent}.sub{font-size:14px;line-height:1.5;color:var(--muted);margin:7px 0 16px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{border:1px solid rgba(91,68,179,.09);text-align:left;border-radius:18px;padding:13px;background:rgba(255,255,255,.78);box-shadow:0 8px 24px rgba(57,43,120,.06);min-height:78px}.card b{display:block;font-size:13px;margin-bottom:5px}.card span{font-size:11px;color:var(--muted);line-height:1.3}.msg{display:flex;margin:12px 0;animation:rise .27s ease}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.msg.user{justify-content:flex-end}.airow{display:flex;align-items:flex-start;gap:8px;width:100%}.mini{flex:0 0 28px;width:28px;height:28px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:900;background:linear-gradient(135deg,var(--p1),var(--p3));margin-top:4px}.bubble{max-width:87%;padding:13px 15px;border-radius:20px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}.assistant .bubble{background:var(--panel);border:1px solid rgba(88,70,174,.09);box-shadow:0 8px 24px rgba(56,43,117,.07);border-bottom-left-radius:7px}.user .bubble{color:#fff;background:linear-gradient(135deg,#6f4cff,#974af5 55%,#c044ff);box-shadow:0 9px 24px rgba(111,76,255,.23);border-bottom-right-radius:7px}.typing{display:flex;gap:5px;align-items:center;height:22px}.typing i{width:7px;height:7px;border-radius:50%;background:#8d80cd;animation:hop 1.1s infinite}.typing i:nth-child(2){animation-delay:.13s}.typing i:nth-child(3){animation-delay:.26s}@keyframes hop{0%,60%,100%{transform:none;opacity:.45}30%{transform:translateY(-5px);opacity:1}}.media{max-width:92%;padding:7px;background:#fff;border-radius:21px;border:1px solid var(--line);box-shadow:0 12px 34px rgba(57,43,120,.10)}.media img,.media video{display:block;width:100%;border-radius:16px;background:#eee;min-height:210px;object-fit:cover}.caption{padding:8px 7px 5px;font-size:12px;color:var(--muted)}.error .bubble{background:#fff5f7;border-color:#ffd3dc;color:#9a3950}.composer-wrap{z-index:4;padding:8px 13px max(12px,env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(249,248,255,.99) 65%,rgba(249,248,255,0))}.composer{display:flex;align-items:flex-end;gap:8px;padding:7px 7px 7px 14px;border-radius:25px;background:rgba(255,255,255,.95);border:1px solid rgba(91,70,179,.12);box-shadow:0 12px 35px rgba(58,44,122,.12)}textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font-size:15px;line-height:22px;max-height:112px;min-height:42px;padding:10px 0}textarea::placeholder{color:#aaa6bb}.send{width:46px;height:46px;flex:0 0 46px;border:0;border-radius:16px;color:#fff;background:linear-gradient(135deg,var(--p1),var(--p2) 55%,var(--pink));box-shadow:0 8px 20px rgba(111,76,255,.27);font-size:22px}.send:disabled{opacity:.45}.hint{text-align:center;color:#a09bad;font-size:10px;padding-top:5px}.sheet{position:fixed;z-index:20;inset:0;background:rgba(27,22,50,.25);display:none;align-items:flex-end;backdrop-filter:blur(5px)}.sheet.show{display:flex}.panel{width:100%;max-height:80dvh;overflow:auto;background:#fbfaff;border-radius:28px 28px 0 0;padding:15px 18px max(22px,env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(51,36,107,.18)}.handle{width:45px;height:5px;border-radius:5px;background:#ded9ea;margin:0 auto 16px}.panelhead{display:flex;align-items:center;gap:10px}.panelhead h2{font-size:20px;margin:0;flex:1}.newchat{border:0;border-radius:14px;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;padding:10px 13px;font-weight:800}.history-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}.history-item{border:1px solid var(--line);background:#fff;border-radius:17px;padding:13px;text-align:left}.history-item.active{border-color:#9b70ff;box-shadow:0 0 0 3px rgba(111,76,255,.08)}.history-title{font-weight:850;font-size:14px;color:#29283e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history-preview{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.signin{display:none;margin:8px 14px 0;padding:10px 12px;border:1px solid #eadfff;border-radius:14px;background:#fff8ff;color:#6c47d7;font-size:12px;font-weight:800;text-align:center}.signin.show{display:block}
</style>
</head>
<body>
<div class="app"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<header><div class="mark">L</div><div class="brand"><h1>Luma</h1><div class="status"><span class="dot" id="dot"></span><span id="status">Puter AI ready</span></div></div><button class="iconbtn" onclick="openHistory()">☰</button><button class="iconbtn" onclick="newChat(true)">＋</button></header>
<div class="signin" id="signin">First AI use may ask you to sign in to Puter. You can use a temporary account.</div>
<div class="modebar"><button class="mode active" id="mchat" onclick="setMode('chat')">✦ Chat</button><button class="mode" id="mimage" onclick="setMode('image')">▧ Image</button><button class="mode" id="mvideo" onclick="setMode('video')">▶ Video</button></div>
<main id="messages"></main>
<div class="composer-wrap"><div class="composer"><textarea id="input" rows="1" placeholder="Message Luma…"></textarea><button class="send" id="send" onclick="sendMessage()">→</button></div><div class="hint">Enter to send · Shift + Enter for a new line</div></div>
</div>
<div class="sheet" id="historySheet" onclick="if(event.target===this)closeHistory()"><div class="panel"><div class="handle"></div><div class="panelhead"><h2>Chat history</h2><button class="newchat" onclick="newChat(true)">＋ New chat</button></div><div class="history-list" id="historyList"></div></div></div>
<script>
let mode='chat',busy=false,conversations=[],activeId=null;
const $=id=>document.getElementById(id), messages=$('messages'), input=$('input'), send=$('send');
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function load(){try{conversations=JSON.parse(localStorage.getItem('luma_conversations_v4')||'[]')}catch(e){conversations=[]}}
function save(){localStorage.setItem('luma_conversations_v4',JSON.stringify(conversations))}
function active(){return conversations.find(c=>c.id===activeId)}
function titleFrom(s){let t=s.trim().replace(/\s+/g,' ').split(' ').slice(0,4).join(' ');return t.length>34?t.slice(0,34):t||'New chat'}
function newChat(opened){const c={id:uid(),title:'New chat',created:Date.now(),messages:[]};conversations.unshift(c);activeId=c.id;save();render();if(opened)closeHistory()}
function boot(){load();newChat(false);render();try{$('signin').classList.toggle('show',!puter.auth.isSignedIn())}catch(e){$('signin').classList.add('show')}}
function setMode(m){mode=m;['chat','image','video'].forEach(x=>$('m'+x).classList.toggle('active',x===m));input.placeholder=m==='chat'?'Message Luma…':m==='image'?'Describe the image you want…':'Describe the video you want…'}
function welcome(){return `<div class="welcome"><h2 class="hello"><span class="grad">Anything is possible</span><br>with Luma</h2><div class="sub">Chat with a powerful AI, create images with GPT Image, or generate short videos.</div><div class="cards"><button class="card" onclick="quick('Explain something interesting about space')"><b>✦ Ask anything</b><span>Answers, ideas, explanations and writing</span></button><button class="card" onclick="setMode('image');quick('A futuristic neon city at sunset, cinematic, ultra detailed')"><b>▧ Create an image</b><span>Generate high-quality artwork from a prompt</span></button></div></div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const c=active();if(!c||!c.messages.length){messages.innerHTML=welcome();return}messages.innerHTML='';for(const m of c.messages)addMsg(m,false);messages.scrollTop=messages.scrollHeight}
function addMsg(m,scroll=true){let el=document.createElement('div');if(m.kind==='image'||m.kind==='video'){el.className='msg assistant';let media=m.kind==='image'?`<img src="${esc(m.src)}">`:`<video src="${esc(m.src)}" controls playsinline></video>`;el.innerHTML=`<div class="airow"><div class="mini">L</div><div class="media">${media}<div class="caption">${esc(m.text||'Generated by Luma')}</div></div></div>`}else if(m.role==='user'){el.className='msg user';el.innerHTML=`<div class="bubble">${esc(m.text)}</div>`}else{el.className='msg assistant'+(m.error?' error':'');el.innerHTML=`<div class="airow"><div class="mini">L</div><div class="bubble">${esc(m.text)}</div></div>`}messages.appendChild(el);if(scroll)messages.scrollTop=messages.scrollHeight}
function typing(on){const old=$('typing');if(old)old.remove();if(!on)return;let el=document.createElement('div');el.id='typing';el.className='msg assistant';el.innerHTML='<div class="airow"><div class="mini">L</div><div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div></div>';messages.appendChild(el);messages.scrollTop=messages.scrollHeight}
async function ensureAuth(){try{if(puter.auth.isSignedIn())return true;$('status').textContent='Sign in to use AI';$('dot').classList.add('off');await puter.auth.signIn({attempt_temp_user_creation:true});$('status').textContent='Puter AI connected';$('dot').classList.remove('off');$('signin').classList.remove('show');return true}catch(e){throw new Error(e?.msg||e?.message||'Sign-in was cancelled')}}
async function sendMessage(){const text=input.value.trim();if(!text||busy)return;busy=true;send.disabled=true;input.value='';let c=active();if(!c){newChat(false);c=active()}c.messages.push({role:'user',kind:'text',text});if(c.title==='New chat')c.title=titleFrom(text);save();render();typing(true);try{await ensureAuth();if(mode==='chat')await doChat(c);else if(mode==='image')await doImage(c,text);else await doVideo(c,text)}catch(e){typing(false);c.messages.push({role:'assistant',kind:'text',text:'AI request failed: '+(e?.message||String(e)),error:true});save();render()}finally{busy=false;send.disabled=false;input.focus()}}
async function doChat(c){const history=c.messages.filter(x=>x.kind==='text'&&!x.error).slice(-18).map(x=>({role:x.role==='assistant'?'assistant':'user',content:x.text}));const r=await puter.ai.chat(history,{model:'openai/gpt-5.6-luna',normalize:true});const out=(r&&r.message&&typeof r.message.content==='string')?r.message.content:String(r||'');if(!out||out==='[object Object]')throw new Error('AI returned an empty response');typing(false);c.messages.push({role:'assistant',kind:'text',text:out});save();render()}
async function doImage(c,text){const img=await puter.ai.txt2img(text,{model:'openai/gpt-image-2'});typing(false);const src=img?.src||img?.getAttribute?.('src')||String(img||'');if(!src)throw new Error('No image returned');c.messages.push({role:'assistant',kind:'image',src,text:'Generated with GPT Image 2'});save();render()}
async function doVideo(c,text){const vid=await puter.ai.txt2vid(text,{model:'veo-3.1-lite',seconds:4,size:'720x1280'});typing(false);const src=vid?.src||vid?.getAttribute?.('src')||String(vid||'');if(!src)throw new Error('No video returned');c.messages.push({role:'assistant',kind:'video',src,text:'Generated with Veo 3.1 Lite'});save();render()}
function quick(t){input.value=t;sendMessage()}
function openHistory(){renderHistory();$('historySheet').classList.add('show')}
function closeHistory(){$('historySheet').classList.remove('show')}
function renderHistory(){const list=$('historyList');list.innerHTML='';for(const c of conversations){const b=document.createElement('button');b.className='history-item'+(c.id===activeId?' active':'');let last=[...c.messages].reverse().find(m=>m.text);b.innerHTML=`<div class="history-title">${esc(c.title)}</div><div class="history-preview">${esc(last?.text||'Empty conversation')}</div>`;b.onclick=()=>{activeId=c.id;save();render();closeHistory()};list.appendChild(b)}}
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});input.addEventListener('input',()=>{input.style.height='42px';input.style.height=Math.min(input.scrollHeight,112)+'px'});
window.addEventListener('error',e=>{if(String(e.message).toLowerCase().includes('puter')){$('status').textContent='Puter AI unavailable';$('dot').classList.add('off')}});
boot();
</script>
</body>
</html>
