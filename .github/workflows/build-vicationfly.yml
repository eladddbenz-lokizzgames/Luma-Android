name: Build Vicationfly APK
on:
  push:
    paths:
      - 'vicationfly/**'
      - '.github/workflows/build-vicationfly.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vicationfly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Vicationfly-APK
          path: vicationfly/app/build/outputs/apk/debug/app-debug.apk
