name: Build Luma AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release bundle
        run: gradle bundleRelease --stacktrace

      - name: Generate upload key and sign AAB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          PASS="$(openssl rand -hex 18)"
          keytool -genkeypair -v \
            -keystore release-output/luma-upload-key.jks \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias luma-upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Luma Upload, OU=Luma, O=Luma, L=Jerusalem, ST=Jerusalem, C=IL"
          cp app/build/outputs/bundle/release/app-release.aab release-output/Luma-release.aab
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release-output/luma-upload-key.jks \
            -storepass "$PASS" -keypass "$PASS" \
            release-output/Luma-release.aab luma-upload
          jarsigner -verify -verbose -certs release-output/Luma-release.aab
          printf '%s\n' "alias=luma-upload" "storePassword=$PASS" "keyPassword=$PASS" > release-output/KEY-CREDENTIALS.txt

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Luma-release
          path: release-output/
          if-no-files-found: error
